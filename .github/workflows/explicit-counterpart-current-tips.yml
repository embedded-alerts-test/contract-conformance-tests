name: explicit counterpart current-tip contract system
on:
  pull_request:
    paths: ['.github/workflows/explicit-counterpart-current-tips.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/explicit-counterpart-current-tips.yml']
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  current-production-contracts:
    uses: zed-pkg-test/.github/.github/workflows/reusable-explicit-counterpart-current-tips.yml@28da20bc67b963c084b6498102a153179b68f6c0
    with:
      test_owner: embedded-alerts-test
      test_owner_id: '313177687'
      production_owner: embedded-alerts
      production_owner_id: '313129319'
      governance_repository: embedded-alerts-test/.github
    secrets:
      read_token: ${{ secrets.TEST_FLEET_READ_TOKEN || secrets.TEST_FLEET_GITHUB_TOKEN || github.token }}
